
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Glass Vision | Shaxriyor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --cyan:#58eaff;
 --blue:#5685ff;
 --violet:#a879ff;
 --white:#f4f8ff;
 --muted:#9baac4;
}

body{
 min-height:100svh;
 display:grid;
 place-items:center;
 padding:18px;
 overflow-x:hidden;
 font-family:Inter,Arial,sans-serif;
 color:var(--white);
 background:#080b18;
 position:relative;
}

body:before,body:after{
 content:"";
 position:fixed;
 width:300px;
 height:300px;
 border-radius:50%;
 filter:blur(100px);
 opacity:.35;
 pointer-events:none;
}
body:before{
 background:#225bff;
 top:-130px;
 left:-130px;
}
body:after{
 background:#923cff;
 bottom:-130px;
 right:-130px;
}

.ambient{
 position:fixed;
 inset:0;
 pointer-events:none;
 background:
 radial-gradient(ellipse at 50% 50%,#122c4d66,transparent 65%),
 linear-gradient(130deg,transparent,#16213b44,transparent);
}

.container{
 width:100%;
 max-width:370px;
 position:relative;
 z-index:1;
}

.card{
 position:relative;
 overflow:hidden;
 padding:23px;
 border-radius:26px;
 border:1px solid #a4caff35;
 background:linear-gradient(
  145deg,
  #ffffff12,
  #ffffff05 45%,
  #8b72ff0b
 );
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
 box-shadow:
  0 25px 80px #0008,
  inset 0 1px 1px #ffffff25;
}

.card:before{
 content:"";
 position:absolute;
 width:190px;
 height:190px;
 border-radius:50%;
 background:#50dfff;
 filter:blur(100px);
 opacity:.13;
 top:-100px;
 right:-90px;
 pointer-events:none;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding-bottom:17px;
 border-bottom:1px solid #ffffff18;
}

.brand{
 font-size:11px;
 letter-spacing:3px;
 font-weight:800;
}
.brand span{color:var(--cyan)}

.live{
 display:flex;
 align-items:center;
 gap:7px;
 font-size:9px;
 color:#8df7d0;
 letter-spacing:1px;
}

.live i{
 width:7px;
 height:7px;
 background:#52e7a5;
 border-radius:50%;
 box-shadow:0 0 12px #52e7a5;
}

.profile{
 text-align:center;
 padding:24px 0 20px;
}

.avatar-wrap{
 width:88px;
 height:88px;
 margin:0 auto 15px;
 padding:3px;
 border-radius:26px;
 background:linear-gradient(135deg,var(--cyan),var(--violet),var(--blue));
 box-shadow:0 0 30px #5685ff40;
}

.avatar{
 width:100%;
 height:100%;
 border-radius:23px;
 display:grid;
 place-items:center;
 background:#10192b;
 font-size:34px;
 font-weight:800;
 color:white;
}

.name{
 font-size:25px;
 font-weight:750;
 letter-spacing:-.7px;
}

.name span{
 background:linear-gradient(90deg,var(--cyan),#b8a0ff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.tag{
 display:inline-block;
 margin-top:9px;
 padding:6px 12px;
 border-radius:20px;
 border:1px solid #58eaff30;
 background:#58eaff0c;
 color:var(--cyan);
 font-size:9px;
 letter-spacing:1.5px;
}

.divider{
 height:1px;
 background:linear-gradient(90deg,transparent,#8d9fce44,transparent);
}

.heading{
 margin:19px 0 10px;
 color:#9caec9;
 font-size:9px;
 font-weight:700;
 letter-spacing:2px;
}

.info{
 display:flex;
 align-items:center;
 gap:13px;
 padding:13px;
 margin-bottom:9px;
 border-radius:15px;
 border:1px solid #ffffff12;
 background:linear-gradient(110deg,#ffffff0d,#ffffff04);
}

.info-icon{
 width:37px;
 height:37px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:#58eaff12;
 color:var(--cyan);
 font-size:18px;
 flex-shrink:0;
}

.info-content{min-width:0;flex:1}

.label{
 font-size:9px;
 color:var(--muted);
 letter-spacing:1.2px;
 margin-bottom:6px;
}

.value{
 font-size:14px;
 font-weight:650;
 overflow-wrap:anywhere;
}

.copy{
 width:100%;
 text-align:left;
 font-family:inherit;
 color:inherit;
 cursor:pointer;
 transition:.2s;
}
.copy:hover{
 border-color:#58eaff60;
 background:#58eaff12;
}

.copy-button{
 color:var(--cyan);
 font-size:18px;
}

.copy-hint{
 font-size:9px;
 color:var(--cyan);
 margin-top:6px;
 letter-spacing:1px;
}

.social-heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:19px 0 11px;
}

.social-heading b{
 font-size:9px;
 letter-spacing:2px;
 color:#a9b8d3;
}

.social-heading span{
 color:#788aa9;
 font-size:9px;
}

.socials{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.social{
 display:flex;
 align-items:center;
 gap:9px;
 padding:12px 10px;
 min-width:0;
 text-decoration:none;
 color:white;
 border:1px solid #ffffff15;
 border-radius:14px;
 background:#ffffff09;
 transition:.25s;
}

.social:hover{
 transform:translateY(-3px);
 border-color:#58eaff65;
 background:#58eaff12;
 box-shadow:0 7px 25px #58eaff12;
}

.social-icon{
 width:34px;
 height:34px;
 display:grid;
 place-items:center;
 flex-shrink:0;
 border-radius:11px;
 background:linear-gradient(145deg,#3c82ff55,#a879ff30);
 font-size:17px;
}

.social-name{
 font-size:11px;
 font-weight:700;
}

.social-user{
 color:var(--muted);
 font-size:9px;
 margin-top:4px;
}

.footer{
 margin-top:19px;
 padding-top:14px;
 text-align:center;
 border-top:1px solid #ffffff15;
}

.footer strong{
 font-size:9px;
 letter-spacing:3px;
 color:#9eb6dc;
}

.footer p{
 margin-top:7px;
 color:#64738d;
 font-size:8px;
 letter-spacing:1px;
}

#toast{
 position:fixed;
 z-index:10;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 padding:12px 19px;
 border:1px solid #58eaff55;
 border-radius:30px;
 background:#152b42;
 color:white;
 font-size:12px;
 white-space:nowrap;
 opacity:0;
 transition:.25s;
 pointer-events:none;
}
#toast.show{opacity:1}

@media(max-width:360px){
 .card{padding:18px}
 .name{font-size:22px}
 .avatar-wrap{width:76px;height:76px}
}
</style>
</head>

<body>
<div class="ambient"></div>

<main class="container">
<div class="card">

 <header class="top">
  <div class="brand">GLASS<span>VISION</span></div>
  <div class="live"><i></i> DIGITAL PROFILE</div>
 </header>

 <section class="profile">
  <div class="avatar-wrap">
   <div class="avatar">S</div>
  </div>

  <h1 class="name"><span>Shaxriyor</span> Axmatov</h1>
  <div class="tag">✦ PERSONAL IDENTITY</div>
 </section>

 <div class="divider"></div>

 <div class="heading">PERSONAL INFORMATION</div>

 <div class="info">
  <div class="info-icon">⌕</div>
  <div class="info-content">
   <div class="label">PHONE NUMBER</div>
   <div class="value">+998 88 672 23 01</div>
  </div>
 </div>

 <button class="info copy" onclick="copyCard()">
  <div class="info-icon">▤</div>
  <div class="info-content">
   <div class="label">BANK CARD</div>
   <div class="value" id="cardNumber">6262 9102 3653 4095</div>
   <div class="copy-hint">TAP TO COPY ↗</div>
  </div>
  <span class="copy-button">⧉</span>
 </button>

 <div class="social-heading">
  <b>SOCIAL CONNECTIONS</b>
  <span>CONNECT ↗</span>
 </div>

 <div class="socials">
  <a class="social"
     href="https://t.me/Akhmatuv"
     target="_blank" rel="noopener">
   <div class="social-icon">✈</div>
   <div>
    <div class="social-name">Telegram</div>
    <div class="social-user">@Akhmatuv</div>
   </div>
  </a>

  <a class="social"
     href="https://instagram.com/Akhmatuv23"
     target="_blank" rel="noopener">
   <div class="social-icon">◎</div>
   <div>
    <div class="social-name">Instagram</div>
    <div class="social-user">@Akhmatuv23</div>
   </div>
  </a>
 </div>

 <footer class="footer">
  <strong>SHAKHRIYOR</strong>
  <p>FUTURE IS YOUR IDENTITY · © 2026</p>
 </footer>

</div>
</main>

<div id="toast">✓ Nusxalandi!</div>

<script>
async function copyCard(){
 const number=document.getElementById("cardNumber").textContent.trim();

 try{
  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(number);
  }else{
   const el=document.createElement("textarea");
   el.value=number;
   document.body.appendChild(el);
   el.select();
   const ok=document.execCommand("copy");
   el.remove();
   if(!ok)throw Error();
  }
  showToast("✓ Karta raqami nusxalandi!");
 }catch(e){
  showToast("Nusxalash amalga oshmadi");
 }
}

let timer;
function showToast(message){
 const t=document.getElementById("toast");
 t.textContent=message;
 t.classList.add("show");
 clearTimeout(timer);
 timer=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
